name: Format

on:
  pull_request:
    paths-ignore:
      - .vitepress/sidebars/versioned/**
      - reference/*.*/**
      - reference/latest/src/main/generated/**
      - translated/**
      - versions/**
  workflow_dispatch:

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      - if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8
      - if: ${{ !cancelled() }}
        run: pnpm run lint:css
      - if: ${{ !cancelled() }}
        run: pnpm run format
      - if: ${{ !cancelled() }}
        run: |
          readarray -d "" files < <(git ls-files --modified --others --exclude-standard -z)
          [[ ${#files[@]} -eq 0 ]] && exit 0
          for f in "${files[@]}"; do
            echo "::error file=${f},title=Prettier::Format this file with 'npx prettier --write \"${f}\"'"
          done
          exit 1
